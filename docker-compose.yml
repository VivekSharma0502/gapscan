services:
  redis:
    image: redis:7-alpine
    # Security: published on loopback only. Redis has no auth by default here,
    # so it must never be reachable from the network.
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:17-alpine
    # Security: dev-only credentials, so this is published on loopback only.
    # Production uses Supabase, with its own URL in DATABASE_URL.
    environment:
      POSTGRES_USER: gapscan
      POSTGRES_PASSWORD: gapscan_dev
      POSTGRES_DB: gapscan
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gapscan -d gapscan"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
  postgres-data:
