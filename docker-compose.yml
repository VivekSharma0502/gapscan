services:
  redis:
    image: redis:7-alpine
    # Security: published on loopback only. Redis has no auth by default here,
    # so it must never be reachable from the network.
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
